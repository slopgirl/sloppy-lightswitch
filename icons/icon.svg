<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <clipPath id="plate">
      <rect x="3" y="3" width="90" height="90" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#plate)">
    <!-- day side / night side -->
    <rect x="3" y="3" width="45" height="90" fill="#ffe9a8"/>
    <rect x="48" y="3" width="45" height="90" fill="#2e3161"/>
    <!-- sun -->
    <circle cx="24" cy="24" r="8" fill="#ffb730"/>
    <g stroke="#ffb730" stroke-width="3" stroke-linecap="round">
      <line x1="24" y1="10" x2="24" y2="7"/>
      <line x1="24" y1="38" x2="24" y2="41"/>
      <line x1="10" y1="24" x2="7" y2="24"/>
      <line x1="38" y1="24" x2="41" y2="24"/>
      <line x1="14.1" y1="14.1" x2="12" y2="12"/>
      <line x1="33.9" y1="33.9" x2="36" y2="36"/>
      <line x1="14.1" y1="33.9" x2="12" y2="36"/>
      <line x1="33.9" y1="14.1" x2="36" y2="12"/>
    </g>
    <!-- moon (crescent via overlay) -->
    <circle cx="74" cy="70" r="10" fill="#f6f1d5"/>
    <circle cx="78" cy="66" r="9" fill="#2e3161"/>
    <!-- stars -->
    <path d="M76 13 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#f6f1d5"/>
    <circle cx="86" cy="34" r="2" fill="#f6f1d5"/>
    <circle cx="64" cy="26" r="1.5" fill="#f6f1d5"/>
  </g>
  <!-- switch plate -->
  <rect x="35" y="22" width="26" height="52" rx="13" fill="#fffdf7" stroke="#3a3a3a" stroke-width="3"/>
  <!-- knob with a cute face -->
  <circle cx="48" cy="37" r="9.5" fill="#ff9cb0" stroke="#3a3a3a" stroke-width="3"/>
  <circle cx="44.5" cy="35.5" r="1.4" fill="#3a3a3a"/>
  <circle cx="51.5" cy="35.5" r="1.4" fill="#3a3a3a"/>
  <path d="M44.5 39.5 q3.5 3 7 0" stroke="#3a3a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="41.5" cy="38.5" r="1.3" fill="#ff6e8a" opacity="0.75"/>
  <circle cx="54.5" cy="38.5" r="1.3" fill="#ff6e8a" opacity="0.75"/>
  <!-- outer border -->
  <rect x="3" y="3" width="90" height="90" rx="22" fill="none" stroke="#3a3a3a" stroke-width="4"/>
</svg>
